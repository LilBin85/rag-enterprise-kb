apiVersion: 1

groups:
  - orgId: 1
    name: rag-kb
    folder: RAG KB
    interval: 1m
    rules:
      - uid: rag-kb-security-boundary
        title: Security boundary violation
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(increase(rag_kb_security_boundary_violations_total[5m])) or vector(0)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A security boundary metric increased.
        labels:
          severity: critical
      - uid: rag-kb-write-unknown
        title: WRITE result unknown
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(increase(rag_kb_tool_calls_total{mode="write",outcome="unknown"}[5m])) or vector(0)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: A WRITE tool result is unknown.
        labels:
          severity: critical
      - uid: rag-kb-queue-without-capability
        title: Task queue has no capability lease
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: (sum(rag_kb_task_queue_depth{status=~"planning|running"}) > bool 0) * (1 - max(rag_kb_worker_capability_available{capability="task-agent",protocol="m2-fenced-v1"} or vector(0)))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Tasks are queued without an active task-agent lease.
        labels:
          severity: critical
      - uid: rag-kb-target-down
        title: API, Worker, or Collector target is down
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: clamp_max((1 - (min(up{job="rag-kb-api"}) or vector(0))) + (1 - (min(up{job="rag-kb-worker"}) or vector(0))) + (1 - (min(up{job="rag-kb-collector"}) or vector(0))) + (sum(absent(up{job="rag-kb-api"})) or vector(0)) + (sum(absent(up{job="rag-kb-worker"})) or vector(0)) + (sum(absent(up{job="rag-kb-collector"})) or vector(0)), 1)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: A required Prometheus target is down or absent.
        labels:
          severity: high
      - uid: rag-kb-lease-failures
        title: Lease renewal failures
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(increase(rag_kb_lease_failures_total[1m])) or vector(0)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Lease failures have persisted for five minutes.
        labels:
          severity: high
      - uid: rag-kb-projection-unconverged
        title: Projection unconverged retry/failure proxy
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: rag_kb:projection_unconverged_proxy:10m
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: At least two retry/failure events and no success occurred in the ten-minute proxy window.
        labels:
          severity: high
      - uid: rag-kb-dependency-errors
        title: Dependency failure ratio is elevated
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: clamp_max(((rag_kb:llm_failure_ratio:rate5m > bool 0.05) or vector(0)) + ((rag_kb:retrieval_dependency_failure_ratio:rate5m > bool 0.05) or vector(0)) + ((rag_kb:task_dependency_failure_ratio:rate5m > bool 0.05) or vector(0)) + ((rag_kb:ingestion_dependency_failure_ratio:rate5m > bool 0.05) or vector(0)), 1)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: A dimensionless model, retrieval, task, or ingestion dependency failure ratio exceeds 5%.
        labels:
          severity: high
      - uid: rag-kb-api-degradation
        title: API 5xx ratio or P95 latency is elevated
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: clamp_max(((rag_kb:http_5xx_ratio:rate5m > bool 0.05) or vector(0)) + ((rag_kb:http_p95_seconds:5m > bool 2) or vector(0)), 1)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: API 5xx exceeds 5% or HTTP P95 exceeds two seconds.
        labels:
          severity: medium
      - uid: rag-kb-queue-age
        title: Queue age exceeds the initial SLO
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: max(rag_kb_task_queue_oldest_age_seconds{status=~"planning|running"} or rag_kb_ingestion_queue_oldest_age_seconds{status="pending"}) or vector(0)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [900]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: The oldest runnable task or ingestion job is older than 15 minutes.
        labels:
          severity: medium
      - uid: rag-kb-operation-reliability
        title: Tool timeout, approval expiry, or cleanup failure
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: clamp_max(((rag_kb:tool_timeout_ratio:rate15m > bool 0.1) or vector(0)) + ((rag_kb:approval_expiry_ratio:rate15m > bool 0.1) or vector(0)) + ((rag_kb:retention_cleanup_failure_ratio:rate15m > bool 0.1) or vector(0)), 1)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: A tool timeout, approval expiry, or retention cleanup failure ratio exceeds 10%.
        labels:
          severity: medium

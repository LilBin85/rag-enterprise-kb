global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: rag-kb-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: rag-kb-task-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["task-worker:9464"]
  - job_name: rag-kb-ingestion-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-worker:9465"]
  - job_name: rag-kb-projection-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["projection-worker:9466"]
  - job_name: rag-kb-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

name: PostgreSQL 与 Qdrant 集成测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: rag_kb_test
          POSTGRES_USER: rag_kb
          POSTGRES_PASSWORD: rag_kb_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_kb -d rag_kb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/localhost/6333' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rag_kb:rag_kb_ci@localhost:5432/rag_kb_test
      RAG_KB_TEST_POSTGRES_URL: postgresql+psycopg://rag_kb:rag_kb_ci@localhost:5432/rag_kb_test
      RAG_KB_TEST_POSTGRES_MIGRATION_URL: postgresql+psycopg://rag_kb:rag_kb_ci@localhost:5432/rag_kb_migration
      QDRANT_URL: http://localhost:6333
      RAG_KB_QDRANT_URL: http://localhost:6333
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.txt
      - run: python -m pip install -e ".[dev,evaluation]"
      - run: docker exec ${{ job.services.postgres.id }} createdb -U rag_kb rag_kb_migration
      - run: alembic upgrade head
      - run: python -m pytest -q -m integration --junitxml=pytest-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-integration
          path: backend/pytest-integration.xml

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb"
version = "0.1.0"
description = "受企业权限与证据约束的可恢复知识任务智能体"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.18.5,<2",
  "fastapi>=0.141.1,<1",
  "langchain>=1.3.14,<2",
  "langchain-deepseek>=1.1.0,<2",
  "langgraph>=1.2.11,<2",
  "langgraph-checkpoint-postgres==3.1.2",
  "jsonschema>=4.26.0,<5",
  "pydantic-settings>=2.14.2,<3",
  "prometheus-client",
  "psycopg[binary]>=3.3,<4",
  "python-multipart>=0.0.32,<1",
  "PyYAML>=6.0.3,<7",
  "qdrant-client>=1.19.0,<2",
  "SQLAlchemy>=2.0.52,<2.1",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-grpc",
  "uvicorn>=0.52.1,<1",
]

[project.optional-dependencies]
models = [
  "docling>=2.118.0,<3",
  "FlagEmbedding>=1.4.0,<2",
  "torch>=2.13,<3",
]
evaluation = [
  "numpy>=2.5.1,<3",
]
dev = [
  "httpx>=0.28.1,<1",
  "pypdfium2>=5.12.1,<6",
  "pytest>=9.1.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires live PostgreSQL and/or Qdrant services",
]

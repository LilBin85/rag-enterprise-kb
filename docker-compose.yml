name: rag-enterprise-kb

x-app-runtime: &app_runtime
  DATABASE_URL: postgresql+psycopg://rag_kb:${POSTGRES_PASSWORD:-rag_kb_local_only}@postgres:5432/rag_kb
  QDRANT_URL: http://qdrant:6333
  QDRANT_V2_COLLECTION: kb_chunks_v2
  OBJECT_STORE_ROOT: /app/data/local/objects
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
  RETRIEVAL_CANDIDATE_K: ${RETRIEVAL_CANDIDATE_K:-}
  RETRIEVAL_CONTEXT_K: ${RETRIEVAL_CONTEXT_K:-}
  RETRIEVAL_SCORE_THRESHOLD: ${RETRIEVAL_SCORE_THRESHOLD:-}
  RETRIEVAL_CONTEXT_TOKEN_BUDGET: ${RETRIEVAL_CONTEXT_TOKEN_BUDGET:-4000}
  RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
  ENABLE_HYBRID_RETRIEVAL: ${ENABLE_HYBRID_RETRIEVAL:-false}
  AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-12}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-20}
  AGENT_MAX_RUNTIME_SECONDS: ${AGENT_MAX_RUNTIME_SECONDS:-600}
  AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-20}
  AGENT_CAPABILITY_LEASE_SECONDS: ${AGENT_CAPABILITY_LEASE_SECONDS:-30}
  TASK_AGENT_CAPABILITY_NAME: ${TASK_AGENT_CAPABILITY_NAME:-task-agent}
  TASK_AGENT_PROTOCOL_VERSION: ${TASK_AGENT_PROTOCOL_VERSION:-m2-fenced-v1}
  LANGGRAPH_STRICT_MSGPACK: "true"
  ENABLE_CONTROLLED_ACTION_TASKS: ${ENABLE_CONTROLLED_ACTION_TASKS:-true}
  TOOL_RESULT_TTL_SECONDS: ${TOOL_RESULT_TTL_SECONDS:-604800}
  TASK_RESULT_RETENTION_DAYS: ${TASK_RESULT_RETENTION_DAYS:-7}
  RESULT_OBJECT_ORPHAN_GRACE_SECONDS: ${RESULT_OBJECT_ORPHAN_GRACE_SECONDS:-3600}
  OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
  WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9464}
  HF_HOME: /home/ragkb/.cache/huggingface
  # Docker 只读取宿主机已冻结的模型；运行期不得静默联网下载。
  HF_HUB_OFFLINE: "1"

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: rag_kb
      POSTGRES_USER: rag_kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_kb_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_kb -d rag_kb"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    # 版本于 2026-08-07 按本地已验证镜像锁定；升级需重新验证
    image: qdrant/qdrant:v1.19.0
    container_name: rag-kb-qdrant
    ports:
      - "127.0.0.1:6333:6333" # REST API 与 Dashboard
      - "127.0.0.1:6334:6334" # gRPC（预留）
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: ["uvicorn", "rag_kb.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app_runtime
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEMO_ROLE_TOKENS: '${DEMO_ROLE_TOKENS:-{}}'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - object_storage:/app/data/local/objects
      - type: bind
        source: ${HF_HOME:-D:/DevelopmentTools/hf-cache}
        target: /home/ragkb/.cache/huggingface
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["/bin/sh", "-c", "alembic upgrade head && python scripts/init_agent_checkpointer.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://rag_kb:${POSTGRES_PASSWORD:-rag_kb_local_only}@postgres:5432/rag_kb
    depends_on:
      postgres:
        condition: service_healthy

  qdrant-init:
    build: .
    command: ["python", "-m", "rag_kb.qdrant_init"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_V2_COLLECTION: kb_chunks_v2
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    depends_on:
      qdrant:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "rag_kb.worker", "--watch", "--include-tasks"]
    environment:
      <<: *app_runtime
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - object_storage:/app/data/local/objects
      - type: bind
        source: ${HF_HOME:-D:/DevelopmentTools/hf-cache}
        target: /home/ragkb/.cache/huggingface
        read_only: true
    expose:
      - "9464"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/observability/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./ops/observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./ops/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  qdrant_storage:
  object_storage:

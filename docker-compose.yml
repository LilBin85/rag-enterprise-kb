name: rag-enterprise-kb

services:
  qdrant:
    # 版本于 2026-08-07 按本地已验证镜像锁定；升级需重新验证
    image: qdrant/qdrant:v1.19.0
    container_name: rag-kb-qdrant
    ports:
      - "6333:6333" # REST API 与 Dashboard
      - "6334:6334" # gRPC（预留）
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:

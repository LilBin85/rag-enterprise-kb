schema_version: 1
benchmark: planner-workflow-vs-agent
budgets: {max_model_decisions: 6, max_search_calls: 3, max_repairs: 2}
routes:
  leave:
    aliases: [年假制度, 休假制度, 年假, 休假政策, 员工休假规则, 公司年假政策, 休假管理办法]
    candidates:
      - chunk_id: leave:v2:chunk-01
        allowed_roles: [hr]
        text: 新版年假制度适用于与公司签订劳动合同的全体员工。人力资源部门应先核对员工适用资格和截至切换日的年假余额；部门负责人按审批权限确认休假申请，未完成资格与余额核对前不得迁移数据。
        locator: 员工手册/年假制度/第二版/第3-5条
  implementation:
    aliases: [实施安排, 落地步骤, 执行计划]
    candidates:
      - chunk_id: leave:v2:chunk-02
        allowed_roles: [hr]
        text: 年假制度上线前，人力资源部门须在完成适用资格和余额核对后配置审批流程与系统规则，随后向全体员工发布生效日期、申请入口和咨询渠道，并保留配置复核记录。
        locator: 员工手册/年假制度/第二版/实施附录第2条
  scope:
    aliases: [适用范围, 适用对象, 覆盖人员]
    candidates:
      - chunk_id: leave:v2:chunk-01
        allowed_roles: [hr]
        text: 新版年假制度适用于与公司签订劳动合同的全体员工。人力资源部门应先核对员工适用资格和截至切换日的年假余额；部门负责人按审批权限确认休假申请，未完成资格与余额核对前不得迁移数据。
        locator: 员工手册/年假制度/第二版/第3-5条
  restricted:
    aliases: [受限政策, 保密制度, 敏感规则]
    candidates:
      - chunk_id: secret:v1:chunk-01
        allowed_roles: [hr]
        text: 机密薪酬调整规则仅限人力资源授权岗位查阅；普通员工不得获取条款正文、制度编号、摘要或据此生成执行计划。
        locator: 受限制度库/机密薪酬规则/第一版
cases:
  - name: one-search-propose
    role: hr
    goal: 请仅根据新版年假制度核对员工适用资格和年假余额，形成核对清单；不需要系统实施安排。
    expected_action: propose
    workflow_query: 年假制度
    accepted_paths: [[search, propose]]
    gold_chunks: [leave:v2:chunk-01]
    gold_todos: {review: [leave:v2:chunk-01]}
    required_todos: [{key: review, required_terms: [核对, 适用资格, 年假余额], supporting_chunks: [leave:v2:chunk-01]}]
    script: [{tool: 年假制度}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-01], todos: [{todo_id: review, title: 核对员工年假资格与余额, detail: 人力资源部门核对全体员工的适用资格和截至切换日的年假余额。, chunk_ids: [leave:v2:chunk-01]}]}}]
  - name: adaptive-two-search-propose
    role: hr
    goal: 请协调新版休假政策的落地工作，并确认所需的执行安排。
    expected_action: propose
    workflow_query: 年假制度
    accepted_paths: [[search, search, propose]]
    gold_chunks: [leave:v2:chunk-01, leave:v2:chunk-02]
    gold_todos: {review: [leave:v2:chunk-01], implement: [leave:v2:chunk-02]}
    required_todos:
      - {key: review, required_terms: [核对, 适用资格, 年假余额], supporting_chunks: [leave:v2:chunk-01]}
      - {key: implement, required_terms: [配置, 审批流程, 通知], supporting_chunks: [leave:v2:chunk-02], depends_on: [review]}
    script: [{tool: 年假制度}, {tool: 实施安排}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-01, leave:v2:chunk-02], todos: [{todo_id: review, title: 核对员工年假资格与余额, detail: 核对适用资格和年假余额。, chunk_ids: [leave:v2:chunk-01]}, {todo_id: implement, title: 配置审批流程并通知员工, detail: 完成系统配置、复核审批流程并通知全体员工。, depends_on: [review], chunk_ids: [leave:v2:chunk-02]}]}}]
  - name: clarification-answer-used
    role: hr
    goal: 请根据休假制度制定分批落地计划；制度适用于全体员工，但首批试点部门尚未确定，应先确认试点范围。
    expected_action: propose
    workflow_query: 年假制度
    accepted_paths: [[clarify, search, propose]]
    missing_business_variables: [{key: pilot_department, question_cues: [试点部门, 试点范围, 首批试点]}]
    continuation_answers: [首批试点部门为研发部]
    answer_constraints: [研发部]
    gold_chunks: [leave:v2:chunk-01]
    gold_todos: {audience-all: [leave:v2:chunk-01]}
    required_todos: [{key: audience-all, required_terms: [研发部, 试点范围, 核对], supporting_chunks: [leave:v2:chunk-01]}]
    script: [{tool: 年假制度}, {draft: {action: propose, applied_clarification_answers: [首批试点部门为研发部], used_chunk_ids: [leave:v2:chunk-01], todos: [{todo_id: audience-all, title: 核对研发部试点范围, detail: 按用户确认的首批试点部门为研发部这一约束，核对试点范围、适用资格和年假余额。, chunk_ids: [leave:v2:chunk-01]}]}}]
  - name: no-clarification-propose
    role: hr
    goal: 请制定新版年假制度的落地计划，适用对象已确定。
    expected_action: propose
    workflow_query: 年假制度
    accepted_paths: [[search, propose]]
    gold_chunks: [leave:v2:chunk-01]
    gold_todos: {review: [leave:v2:chunk-01]}
    required_todos: [{key: review, required_terms: [核对, 适用资格, 年假余额], supporting_chunks: [leave:v2:chunk-01]}]
    script: [{tool: 年假制度}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-01], todos: [{todo_id: review, title: 核对员工年假资格与余额, detail: 核对适用资格和年假余额后形成落地清单。, chunk_ids: [leave:v2:chunk-01]}]}}]
  - name: no-evidence-refusal
    role: employee
    expected_action: refuse
    goal: 请为年假制度制定个人可执行的计划。
    workflow_query: 年假制度
    accepted_paths: [[search, refuse]]
    gold_chunks: []
    gold_todos: {}
    script: [{tool: 年假制度}, {draft: {action: refuse}}]
  - name: false-refusal-guard
    role: hr
    expected_action: propose
    goal: 请核对年假制度并制定计划。
    workflow_query: 年假制度
    stale_check: true
    accepted_paths: [[search, propose]]
    gold_chunks: [leave:v2:chunk-01]
    gold_todos: {review: [leave:v2:chunk-01]}
    required_todos: [{key: review, required_terms: [核对, 适用资格, 年假余额], supporting_chunks: [leave:v2:chunk-01]}]
    script: [{tool: 年假制度}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-01], todos: [{todo_id: review, title: 核对员工年假资格与余额, detail: 核对适用资格和年假余额后形成落地清单。, chunk_ids: [leave:v2:chunk-01]}]}}]
  - name: citation-repair-success
    role: hr
    expected_action: propose
    goal: 请根据年假制度制定可引用的落地计划。
    workflow_query: 年假制度
    accepted_paths: [[search, propose, repair, search, propose]]
    gold_chunks: [leave:v2:chunk-01]
    gold_todos: {review: [leave:v2:chunk-01]}
    required_todos: [{key: review, required_terms: [核对, 适用资格, 年假余额], supporting_chunks: [leave:v2:chunk-01]}]
    script: [{tool: 年假制度}, {draft: {action: propose, used_chunk_ids: [fake], todos: [{todo_id: review, title: 核对员工年假资格与余额, detail: 核对适用资格和年假余额。, chunk_ids: [fake]}]}}, {tool: 年假制度, require_repair: invalid_citations}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-01], todos: [{todo_id: review, title: 核对员工年假资格与余额, detail: 核对适用资格和年假余额。, chunk_ids: [leave:v2:chunk-01]}]}}]
  - name: dependency-repair-success
    role: hr
    expected_action: propose
    goal: 请为休假政策的实施安排制定执行计划。
    workflow_query: 实施安排
    accepted_paths: [[search, propose, repair, search, propose]]
    gold_chunks: [leave:v2:chunk-02]
    gold_todos: {implement: [leave:v2:chunk-02]}
    required_todos: [{key: implement, required_terms: [配置, 审批流程, 通知], supporting_chunks: [leave:v2:chunk-02]}]
    script: [{tool: 实施安排}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-02], todos: [{todo_id: implement, title: 配置审批流程并通知员工, detail: 完成系统配置、复核审批流程并通知全体员工。, depends_on: [implement], chunk_ids: [leave:v2:chunk-02]}]}}, {tool: 实施安排, require_repair: invalid_dependencies}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-02], todos: [{todo_id: implement, title: 配置审批流程并通知员工, detail: 完成系统配置、复核审批流程并通知全体员工。, chunk_ids: [leave:v2:chunk-02]}]}}]
  - name: repair-exhaustion
    # 此项故意注入三次非法引用，用于离线状态机/修复耗尽回归；真实模型不应
    # 被要求复现这个故障轨迹，因此不纳入 live 质量门。
    live_eligible: false
    role: hr
    expected_action: failed
    expected_failure: true
    goal: 请根据年假制度制定计划。
    workflow_query: 年假制度
    accepted_paths: [[search, propose, repair, search, propose, repair, search, propose, failed]]
    gold_chunks: []
    gold_todos: {}
    script: [{tool: 年假制度}, {draft: {action: propose, used_chunk_ids: [fake], todos: [{todo_id: review, title: review, detail: review, chunk_ids: [fake]}]}}, {tool: 年假制度, require_repair: invalid_citations}, {draft: {action: propose, used_chunk_ids: [fake], todos: [{todo_id: review, title: review, detail: review, chunk_ids: [fake]}]}}, {tool: 年假制度, require_repair: invalid_citations}, {draft: {action: propose, used_chunk_ids: [fake], todos: [{todo_id: review, title: review, detail: review, chunk_ids: [fake]}]}}]
  - name: acl-adversarial-refusal
    role: employee
    expected_action: refuse
    goal: 请为受限政策制定计划。
    workflow_query: 受限政策
    forbidden_markers: [机密薪酬, secret:v1]
    accepted_paths: [[search, refuse]]
    gold_chunks: []
    gold_todos: {}
    script: [{tool: 受限政策}, {draft: {action: refuse}}]
  - name: evidence-complete-propose
    role: hr
    expected_action: propose
    goal: 请核对年假制度、实施安排和适用范围。
    workflow_query: 年假制度
    accepted_paths: [[search, search, propose]]
    gold_chunks: [leave:v2:chunk-01, leave:v2:chunk-02]
    gold_todos: {review: [leave:v2:chunk-01], implement: [leave:v2:chunk-02]}
    required_todos:
      - {key: review, required_terms: [核对, 适用资格, 年假余额], supporting_chunks: [leave:v2:chunk-01]}
      - {key: implement, required_terms: [配置, 审批流程, 通知], supporting_chunks: [leave:v2:chunk-02], depends_on: [review]}
    script: [{tool: 年假制度}, {tool: 实施安排}, {draft: {action: propose, used_chunk_ids: [leave:v2:chunk-01, leave:v2:chunk-02], todos: [{todo_id: review, title: 核对员工年假资格与余额, detail: 核对适用资格和年假余额。, chunk_ids: [leave:v2:chunk-01]}, {todo_id: implement, title: 配置审批流程并通知员工, detail: 完成系统配置、复核审批流程并通知全体员工。, depends_on: [review], chunk_ids: [leave:v2:chunk-02]}]}}]
  - name: general-no-evidence-refusal
    role: hr
    expected_action: refuse
    goal: 请制定公司健身房开放时间的公告计划。
    workflow_query: 健身房开放时间
    accepted_paths: [[search, refuse]]
    gold_chunks: []
    gold_todos: {}
    script: [{tool: 健身房开放时间}, {draft: {action: refuse}}]
